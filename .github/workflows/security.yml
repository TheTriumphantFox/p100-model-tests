name: Security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo 'fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan reachable history and working files
        run: bash scripts/check_secrets.sh all
      - name: Verify site policies and archived guards
        run: python3 scripts/refresh_security_metadata.py
      - name: Security regression tests
        run: python3 -m unittest discover -s tests -v
